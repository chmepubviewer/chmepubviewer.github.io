    dropText:"Відкрийте CHM або EPUB. Книга, позиція читання, історія переходів і пошуку зберігаються в цьому браузері.",
    chooseFile:"Вибрати файл", searchPlaceholder:"Пошук у книзі…",
    clearSearch:"Очистити пошук", clearHistory:"Очистити історію",
    recentSearches:"Останні запити", noHistory:"Історія пошуку порожня.",
    searchHint:"Введіть текст для пошуку в усій книзі.",
    searching:"Пошук…", noResults:"Нічого не знайдено.",
    results:"Результатів", matches:"збігів", limit:"Показано перші",
    searchFailed:"Помилка пошуку", openFirst:"Спочатку відкрийте книгу.",
    loading:"Завантаження…", restoring:"Відновлення книги…",
    saving:"Збереження книги…", parsingChm:"Розпакування CHM…",
    loaded:"Книгу завантажено та збережено",
    restored:"Книгу та позицію читання відновлено",
    storageError:"Книгу відкрито, але зберегти її не вдалося.",
    positionError:"Не вдалося зберегти позицію або історію.",
    errorLoad:"Помилка відкриття книги",
    errorRestore:"Не вдалося відновити книгу. Відкрийте файл знову.",
    errorFormat:"Підтримуються лише CHM та EPUB.",
    noToc:"Зміст відсутній", missingPage:"Сторінку не знайдено",
    page:"Сторінка", previousPage:"Попередня сторінка",
    nextPage:"Наступна сторінка", skipped:"Пропущено розділів"
  },
  en: {
    back:"Back", forward:"Forward", contents:"Contents", search:"Search",
    open:"Open", tableOfContents:"Table of contents",
    dropTitle:"Drop a file here",
    dropText:"Open a CHM or EPUB. The book, reading position, navigation history and search history are saved in this browser.",
    chooseFile:"Choose file", searchPlaceholder:"Search this book…",
    clearSearch:"Clear search", clearHistory:"Clear history",
    recentSearches:"Recent searches", noHistory:"No search history yet.",
    searchHint:"Enter text to search the entire book.",
    searching:"Searching…", noResults:"No matches found.",
    results:"Results", matches:"matches", limit:"Showing the first",
    searchFailed:"Search failed", openFirst:"Open a book first.",
    loading:"Loading…", restoring:"Restoring book…",
    saving:"Saving book…", parsingChm:"Decompressing CHM…",
    loaded:"Book loaded and saved",
    restored:"Book and reading position restored",
    storageError:"Book opened, but it could not be saved.",
    positionError:"Could not save the reading position or history.",
    errorLoad:"Could not open the book",
    errorRestore:"Could not restore the book. Please open the file again.",
    errorFormat:"Only CHM and EPUB files are supported.",
    noToc:"No table of contents", missingPage:"Page not found",
    page:"Page", previousPage:"Previous page",
    nextPage:"Next page", skipped:"Skipped sections"
  }
};

let state = {
  lang:"uk",
  fontSize:100,
  tocVisible:true,
  sidebarTab:"toc",
  fileName:null,
  sessionId:null,
  cfi:null,
  chmPath:null,
  chmHash:"",
  chmScroll:0,
  highlightQuery:"",
  searchQuery:"",
  searchHistory:[],
  nav:[],
  navIndex:-1,
  positionUpdatedAt:0
};

let book = null;
let rendition = null;
let chm = null;
let kind = null;
let busy = false;
let navigating = false;
let activeSessionId = null;
let persistedSessionId = null;
let toastTimer = null;
let locationTimer = null;
let scrollTimer = null;
let pageToken = 0;
let chmPageReady = false;
let epubCommand = null;
let searchToken = 0;
let searching = false;
let searchResults = [];
let searchedQuery = "";
let searchSkipped = 0;
let searchLimited = false;
let epubHighlights = new Set();
let searchQueue = Promise.resolve();
let storageWarningShown = false;

const t = key => I18N[state.lang][key] || key;
const pause = () => new Promise(resolve => setTimeout(resolve, 0));

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && typeof saved === "object") state = {...state, ...saved};
  } catch (_) {}

  if (!I18N[state.lang]) state.lang = "uk";
  state.fontSize = Math.max(60, Math.min(220, Number(state.fontSize) || 100));
  state.sidebarTab = state.sidebarTab === "search" ? "search" : "toc";
  state.searchHistory = Array.isArray(state.searchHistory)
    ? state.searchHistory.filter(x => typeof x === "string").slice(0, SEARCH_HISTORY_LIMIT)
    : [];
  state.nav = Array.isArray(state.nav)
    ? state.nav.filter(validNavigation).slice(-HISTORY_LIMIT)
    : [];
  state.navIndex = Math.max(-1, Math.min(state.nav.length - 1, Number(state.navIndex) || 0));
  state.searchQuery = typeof state.searchQuery === "string" ? state.searchQuery.slice(0,200) : "";
  state.highlightQuery = typeof state.highlightQuery === "string" ? state.highlightQuery.slice(0,200) : "";
}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  } catch (error) {
    if (!storageWarningShown) {
      storageWarningShown = true;
      console.warn(error);
      toast(t("positionError"), 7000);
    }
    return false;
  }
}

function applyLang() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-title]").forEach(el => {
    el.title = t(el.dataset.title);
    el.setAttribute("aria-label", t(el.dataset.title));
  });
  document.querySelectorAll("[data-placeholder]").forEach(el => {
    el.placeholder = t(el.dataset.placeholder);
  });
  document.querySelectorAll("[data-lang]").forEach(el => {
    el.classList.toggle("active", el.dataset.lang === state.lang);
  });
  renderSearchResults();
}

function toast(message, duration = 4500) {
  $("toast").textContent = message;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), duration);
}

function setBusy(value, label = "loading") {
  busy = value;
  $("loader").classList.toggle("show", value);
  $("loaderLabel").textContent = t(label);
  if (!value) $("loaderDetail").textContent = "";
  document.querySelectorAll("input[type=file]").forEach(el => el.disabled = value);
  document.querySelectorAll(".file-button").forEach(el => el.classList.toggle("disabled", value));
  updateNavigationButtons();
}

function setSidebar(tab, visible = true) {
  state.sidebarTab = tab === "search" ? "search" : "toc";
  state.tocVisible = visible;
  $("sidebar").classList.toggle("hidden", !visible);
  $("tocPanel").classList.toggle("active", state.sidebarTab === "toc");
  $("searchPanel").classList.toggle("active", state.sidebarTab === "search");
  $("tocTab").classList.toggle("active", state.sidebarTab === "toc");
  $("searchTab").classList.toggle("active", state.sidebarTab === "search");
  saveState();
  if (rendition) setTimeout(() => rendition && rendition.resize(), 50);
}

/* ===================================================================
   INDEXEDDB FILE STORAGE
   Navigation and search histories are additionally saved in localStorage.
=================================================================== */

const DB_NAME = "ChmEpubViewerFiles";
const DB_STORE = "session";
let dbPromise = null;

function openDatabase() {
  if (dbPromise) return dbPromise;

  dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error("IndexedDB unavailable"));
      return;
    }
    const request = indexedDB.open(DB_NAME, 1);
    let rejected = false;

    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains(DB_STORE)) {
        request.result.createObjectStore(DB_STORE);
      }
    };
    request.onsuccess = () => {
      if (rejected) {
        request.result.close();
        return;
      }
      const db = request.result;
      db.onversionchange = () => {
        db.close();
        dbPromise = null;
      };
      resolve(db);
    };
    request.onerror = () => {
      rejected = true;
      reject(request.error);
    };
    request.onblocked = () => {
      rejected = true;
      reject(new Error("Storage blocked by another tab"));
    };
  }).catch(error => {
    dbPromise = null;
    throw error;
  });

  return dbPromise;
}

async function readSavedSession() {
  const db = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get("current");
    let record;
    req.onsuccess = () => record = req.result;
    tx.oncomplete = () => resolve(record || null);
    tx.onabort = tx.onerror = () => reject(tx.error || req.error || new Error("Storage read failed"));
  });
}

async function writeSavedSession(record) {
  const db = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(record, "current");
    tx.oncomplete = resolve;
    tx.onabort = tx.onerror = () => reject(tx.error || new Error("Storage write failed"));
  });
}

async function updateSavedPosition(id, location) {
  const db = await openDatabase();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    const store = tx.objectStore(DB_STORE);
    const req = store.get("current");
    req.onsuccess = () => {
      const record = req.result;
      if (!record || record.id !== id) return;
      if (Number(record.location?.updatedAt) > location.updatedAt) return;
      record.location = location;
      store.put(record, "current");
    };
    tx.oncomplete = resolve;
    tx.onabort = tx.onerror = () => reject(tx.error || new Error("Position save failed"));
  });
}

function newSessionId() {
  return window.crypto?.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
}

function currentLocation() {
  return {
    cfi:state.cfi,
    chmPath:state.chmPath,
    chmHash:state.chmHash,
    chmScroll:state.chmScroll,
    highlightQuery:state.highlightQuery,
    searchQuery:state.searchQuery,
    nav:state.nav.map(item => ({...item})),
    navIndex:state.navIndex,
    updatedAt:state.positionUpdatedAt
  };
}

function applyLocation(location = {}) {
  state.cfi = typeof location.cfi === "string" ? location.cfi : null;
  state.chmPath = typeof location.chmPath === "string" ? location.chmPath : null;
  state.chmHash = typeof location.chmHash === "string" ? location.chmHash : "";
  state.chmScroll = Math.max(0, Number(location.chmScroll) || 0);
  state.highlightQuery = typeof location.highlightQuery === "string" ? location.highlightQuery : "";
  state.searchQuery = typeof location.searchQuery === "string" ? location.searchQuery : "";
  state.nav = Array.isArray(location.nav)
    ? location.nav.filter(validNavigation).slice(-HISTORY_LIMIT)
    : [];
  state.navIndex = Math.max(-1, Math.min(state.nav.length - 1, Number(location.navIndex) || 0));
  state.positionUpdatedAt = Number(location.updatedAt) || 0;
}

function positionChanged() {
  if (!activeSessionId) return;
  state.sessionId = activeSessionId;
  state.positionUpdatedAt = Date.now();
  saveState();
  clearTimeout(locationTimer);
  locationTimer = setTimeout(() => {
    persistPosition().catch(error => console.warn("Position save:", error));
  }, 400);
}

async function persistPosition() {
  clearTimeout(locationTimer);
  if (!activeSessionId || persistedSessionId !== activeSessionId) return;
  await updateSavedPosition(activeSessionId, currentLocation());
}

function captureChmScroll() {
  if (!chm || !chmPageReady) return;
  try {
    state.chmScroll = Math.max(0, $("chm-frame").contentDocument.scrollingElement.scrollTop);
    const item = state.nav[state.navIndex];
    if (item?.kind === "chm" && item.path === state.chmPath) {
      item.scroll = state.chmScroll;
    }
  } catch (_) {}
}

function flushPosition() {
  clearTimeout(scrollTimer);
  captureChmScroll();
  if (activeSessionId) {
    positionChanged();
    persistPosition().catch(console.warn);
  } else {
    saveState();
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushPosition();
});
window.addEventListener("pagehide", flushPosition);

/* ===================================================================
   BACK / FORWARD HISTORY
=================================================================== */

function validNavigation(item) {
  return item && (
    (item.kind === "chm" && typeof item.path === "string") ||
    (item.kind === "epub" && typeof item.cfi === "string")
  );
}

function navigationKey(item) {
  return item.kind === "chm"
    ? "chm:" + item.path + (item.hash || "")
    : "epub:" + item.cfi;
}

function recordNavigation(item, mode = "push") {
  if (!validNavigation(item)) return;
  item = {...item, query:item.query || ""};
  const previous = state.nav[state.navIndex];

  if (
    mode === "replace" ||
    (previous && navigationKey(previous) === navigationKey(item))
  ) {
    if (state.navIndex >= 0) {
      state.nav[state.navIndex] = item;
    } else {
      state.nav = [item];
      state.navIndex = 0;
    }
  } else {
    state.nav = state.nav.slice(0, state.navIndex + 1);
    state.nav.push(item);
    if (state.nav.length > HISTORY_LIMIT) state.nav.shift();
    state.navIndex = state.nav.length - 1;
  }

  updateNavigationButtons();
  positionChanged();
}

function updateNavigationButtons() {
  const disabled = busy || navigating || !activeSessionId;
  $("backBtn").disabled = disabled || state.navIndex <= 0;
  $("forwardBtn").disabled = disabled || state.navIndex >= state.nav.length - 1;
  $("prevBtn").disabled = busy || navigating;
  $("nextBtn").disabled = busy || navigating;
}

async function goHistory(delta) {
  if (busy || navigating || !activeSessionId) return;
  const index = state.navIndex + delta;
  if (index < 0 || index >= state.nav.length) return;

  captureChmScroll();
  const target = {...state.nav[index]};
  const oldIndex = state.navIndex;

  state.navIndex = index;
  navigating = true;
  updateNavigationButtons();

  try {
    if (target.kind === "chm" && chm) {
      const entry = chm.entryMap.get(target.path.toLowerCase());
      if (!entry) throw new Error(t("missingPage"));
      showChmPage(chm, entry, target.hash || "", {
        historyMode:"replace",
        scrollTop:Math.max(0, Number(target.scroll) || 0),
        query:target.query || ""
      });
    } else if (target.kind === "epub" && rendition) {
      state.highlightQuery = target.query || "";
      await displayEpub(target.cfi, {
        mode:"replace",
        query:state.highlightQuery
      });
      await highlightEpubQuery(state.highlightQuery);
    } else {
      throw new Error(t("missingPage"));
    }
    positionChanged();
  } catch (error) {
    state.navIndex = oldIndex;
    toast(error.message);
  } finally {
    navigating = false;
    updateNavigationButtons();
  }
}

$("backBtn").onclick = () => goHistory(-1);
$("forwardBtn").onclick = () => goHistory(1);

/* ===================================================================
   FILE OPENING / CLEANUP
=================================================================== */

function clearCurrentBook() {
  searchToken++;
  searching = false;
  clearTimeout(locationTimer);
  clearTimeout(scrollTimer);
  pageToken++;
  chmPageReady = false;
  activeSessionId = null;
  persistedSessionId = null;
  epubCommand = null;
  epubHighlights.clear();

  if (rendition) {
    try { rendition.destroy(); } catch (_) {}
  }
  if (book) {
    try { book.destroy(); } catch (_) {}
  }
  if (chm) {
    for (const url of chm._urlCache.values()) URL.revokeObjectURL(url);
  }

  rendition = null;
  book = null;
  chm = null;
  kind = null;
  searchResults = [];
  searchedQuery = "";

  $("chm-frame").onload = null;
  $("chm-frame").srcdoc = "";
  $("viewer").replaceChildren();
  $("viewer").classList.remove("active");
  $("chm-content").classList.remove("active");
  $("readerControls").style.display = "none";
  $("tocList").replaceChildren();
  $("progress").textContent = "—";
}

async function handleFile(file, savedRecord = null) {
  if (!file || busy) return;

  const name = savedRecord ? savedRecord.name : file.name;
  const lowerName = (name || "").toLowerCase();
  if (!/\.(chm|epub)$/.test(lowerName)) {
    toast(t("errorFormat"));
    return;
  }

  let restore = null;
  if (savedRecord) {
    restore = savedRecord.location || {};
    if (
      state.sessionId === savedRecord.id &&
      Number(state.positionUpdatedAt) >= Number(restore.updatedAt || 0)
    ) {
      restore = currentLocation();
    }
  }

  setBusy(true, savedRecord ? "restoring" : "loading");

  try {
    flushPosition();
    try { await persistPosition(); } catch (_) {}
    const data = await file.arrayBuffer();

    clearCurrentBook();
    activeSessionId = savedRecord ? savedRecord.id : newSessionId();
    state.sessionId = activeSessionId;
    state.fileName = name;
    applyLocation(restore || {});
    $("searchInput").value = state.searchQuery;
    saveState();

    kind = lowerName.endsWith(".chm") ? "chm" : "epub";

    await pause();

    if (kind === "chm") {
      $("loaderLabel").textContent = t("parsingChm");
      await openChm(data);
    } else {
      await openEpub(data);
    }

    if (savedRecord) {
      persistedSessionId = activeSessionId;
      await persistPosition().catch(console.warn);
      toast(t("restored"));
    } else {
      $("loaderLabel").textContent = t("saving");
      try {
        await writeSavedSession({
          id:activeSessionId,
          name,
          kind,
          blob:file,
          savedAt:Date.now(),
          location:currentLocation()
        });
        persistedSessionId = activeSessionId;
        await persistPosition();
        toast(t("loaded"));
      } catch (error) {
        console.warn(error);
        toast(t("storageError"), 9000);
      }
    }
  } catch (error) {
    console.error(error);
    clearCurrentBook();
    $("dropZone").style.display = "flex";
    toast((savedRecord ? t("errorRestore") : t("errorLoad")) + ": " + error.message, 12000);
  } finally {
    setBusy(false);
    $("fileInput").value = "";
    $("fileInput2").value = "";
    renderSearchResults();
  }

  if (activeSessionId) {
    if (state.searchQuery) {
      runSearch(state.searchQuery, {remember:false, applyHighlight:false});
    }
    if (rendition && state.highlightQuery) {
      highlightEpubQuery(state.highlightQuery).catch(console.warn);
    }
  }
}

$("fileInput").onchange = event => handleFile(event.target.files[0]);
$("fileInput2").onchange = event => handleFile(event.target.files[0]);

["dragenter","dragover"].forEach(type => {
  document.body.addEventListener(type, event => {
    event.preventDefault();
    if (!busy) $("dropZone").classList.add("dragover");
  });
});
["dragleave","drop"].forEach(type => {
  document.body.addEventListener(type, event => {
    event.preventDefault();
    $("dropZone").classList.remove("dragover");
  });
});
document.body.addEventListener("drop", event => handleFile(event.dataTransfer.files[0]));

/* ===================================================================
   EPUB RENDERING
=================================================================== */

async function openEpub(data) {
  if (typeof ePub !== "function") {
    throw new Error("EPUB libraries could not be loaded.");
  }

  $("dropZone").style.display = "none";
  $("viewer").classList.add("active");
  $("readerControls").style.display = "flex";

  book = ePub(data);
  rendition = book.renderTo("viewer", {
    width:"100%",
    height:"100%",
    flow:"paginated",
    spread:"none"
  });

  rendition.themes.fontSize(state.fontSize + "%");
  rendition.on("relocated", location => {
    if (!location?.start || !activeSessionId) return;
    if (epubCommand) {
      epubCommand.location = location;
      updateEpubProgress(location);
      return;
    }
    commitEpubLocation(location, "push", state.highlightQuery);
  });

  rendition.on("keyup", onReaderKey);
  rendition.on("rendered", () => {
    // EPUB highlights are maintained through the annotation API,
    // avoiding changes to text nodes that could invalidate CFIs.
  });

  try {
    await displayEpub(state.cfi || undefined, {
      mode:state.nav.length ? "replace" : "push",
      query:state.highlightQuery
    });
  } catch (error) {
    if (!state.cfi) throw error;
    state.nav = [];
    state.navIndex = -1;
    await displayEpub(undefined, {mode:"push", query:""});
  }

  const navigation = await book.loaded.navigation;
  buildEpubToc(navigation.toc || []);
  const location = rendition.currentLocation();
  if (location?.start) highlightEpubToc(location.start.href);
  scrollSelectedToc();
}

function commitEpubLocation(location, mode, query) {
  if (!location?.start?.cfi) return;
  state.cfi = location.start.cfi;
  state.highlightQuery = query || "";
  recordNavigation({
    kind:"epub",
    cfi:state.cfi,
    href:location.start.href || "",
    query:state.highlightQuery
  }, mode);
  updateEpubProgress(location);
  highlightEpubToc(location.start.href);
}

async function displayEpub(target, options = {}) {
  if (!rendition) return;
  const current = rendition;
  const command = {location:null};
  epubCommand = command;

  try {
    await current.display(target);
    await new Promise(resolve => requestAnimationFrame(() =>
      requestAnimationFrame(resolve)
    ));
    if (current !== rendition) return;
    const location = command.location || current.currentLocation();
    commitEpubLocation(location, options.mode || "push", options.query || "");
  } finally {
    if (epubCommand === command) epubCommand = null;
  }
}

function buildEpubToc(items) {
  $("tocList").replaceChildren();

  function add(list, level = 0) {
    list.forEach(item => {
      const button = document.createElement("button");
      button.className = "toc-item" + (level ? " sub" : "");
      button.style.paddingLeft = Math.min(100, 14 + level * 16) + "px";
      button.textContent = (item.label || item.href || "").trim();
      button.title = button.textContent;
      button.dataset.href = item.href || "";
      button.onclick = () => navigateEpub(item.href);
      $("tocList").appendChild(button);
      if (item.subitems?.length) add(item.subitems, level + 1);
    });
  }

  add(items);
}

async function navigateEpub(target, query = state.highlightQuery) {
  if (busy || navigating || !rendition) return;
  navigating = true;
  updateNavigationButtons();
  try {
    await displayEpub(target, {query});
    await highlightEpubQuery(query);
  } catch (error) {
    toast(error.message);
  } finally {
    navigating = false;
    updateNavigationButtons();
  }
}

function highlightEpubToc(href) {
  const items = [...$("tocList").querySelectorAll(".toc-item")];
  let selected = null;
  for (const item of items) {
    const path = (item.dataset.href || "").split("#")[0];
    if (path && href && (href === path || href.endsWith("/" + path))) {
      if (!selected) selected = item;
    }
  }
  items.forEach(item => item.classList.toggle("active", item === selected));
}

function updateEpubProgress(location) {
  const displayed = location?.start?.displayed;
  if (displayed) {
    $("progress").textContent = `${t("page")} ${displayed.page}/${displayed.total}`;
  }
}

/* ===================================================================
   SEARCH / HIGHLIGHTING

   CHM: search article text and highlight matches using DOM text nodes.
   EPUB: section.find() provides stable range CFIs; the annotation API
   highlights matches without modifying the source text.
=================================================================== */

function escapeRegExp(value) {
  return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function queryRegExp(query) {
  return new RegExp(
    query.trim().split(/\s+/).map(escapeRegExp).join("\\s+"),
    "giu"
  );
}

function textMap(documentObject) {
  const root = documentObject.body || documentObject.documentElement;
  const walker = documentObject.createTreeWalker(
    root,
    NodeFilter.SHOW_TEXT,
    {
      acceptNode(node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const parent = node.parentElement;
        if (!parent || parent.closest(
          "script,style,noscript,template,textarea,select,svg,[hidden]"
        )) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    }
  );

  let node;
  let text = "";
  const nodes = [];

  while ((node = walker.nextNode())) {
    if (text) text += " ";
    const start = text.length;
    text += node.nodeValue;
    nodes.push({node, start, end:text.length});
  }
  return {text, nodes};
}

function clearDocumentHighlights(documentObject) {
  documentObject.querySelectorAll("mark[data-reader-search]").forEach(mark => {
    const parent = mark.parentNode;
    while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    mark.remove();
    parent.normalize();
  });
}

function highlightDocument(documentObject, query, scrollToFirst = false) {
  clearDocumentHighlights(documentObject);
  if (!query.trim()) return 0;

  const map = textMap(documentObject);
  const regex = queryRegExp(query);
  const matches = [];
  let match;

  while ((match = regex.exec(map.text)) && matches.length < 3000) {
    matches.push({start:match.index, end:match.index + match[0].length});
  }

  // Wrap from the end so original text-node offsets remain valid.
  for (let n = map.nodes.length - 1; n >= 0; n--) {
    const part = map.nodes[n];
    for (let m = matches.length - 1; m >= 0; m--) {
      const hit = matches[m];
      if (hit.end <= part.start) break;
      if (hit.start >= part.end) continue;

      const start = Math.max(0, hit.start - part.start);
      const end = Math.min(part.end - part.start, hit.end - part.start);
      if (end <= start) continue;

      const range = documentObject.createRange();
      range.setStart(part.node, start);
      range.setEnd(part.node, end);
      const mark = documentObject.createElement("mark");
      mark.dataset.readerSearch = "1";
      mark.style.cssText = "background:#ffe66d!important;color:#111!important;";
      range.surroundContents(mark);
    }
  }

  if (scrollToFirst) {
    documentObject.querySelector("mark[data-reader-search]")?.scrollIntoView({
      block:"center"
    });
  }
  return matches.length;
}

function appendHighlightedText(element, text, query) {
  if (!query) {
    element.textContent = text;
    return;
  }
  const regex = queryRegExp(query);
  let previous = 0;
  let match;

  while ((match = regex.exec(text))) {
    element.append(document.createTextNode(text.slice(previous, match.index)));
    const mark = document.createElement("mark");
    mark.textContent = match[0];
    element.append(mark);
    previous = match.index + match[0].length;
  }
  element.append(document.createTextNode(text.slice(previous)));
}

function rememberSearch(query) {
  state.searchHistory = [
    query,
    ...state.searchHistory.filter(item => item.toLowerCase() !== query.toLowerCase())
  ].slice(0, SEARCH_HISTORY_LIMIT);
  saveState();
  renderSuggestions();
}

function renderSuggestions() {
  $("searchSuggestions").replaceChildren();
  state.searchHistory.forEach(query => {
    const option = document.createElement("option");
    option.value = query;
    $("searchSuggestions").appendChild(option);
  });
}

function renderSearchResults() {
  const container = $("searchResults");
  container.replaceChildren();
  renderSuggestions();

  if (searching) {
    $("searchStatus").textContent = t("searching");
  } else if (searchedQuery) {
    $("searchStatus").textContent = searchResults.length
      ? `${t("results")}: ${searchResults.length}` +
        (searchLimited ? ` · ${t("limit")} ${SEARCH_RESULT_LIMIT}` : "") +
        (searchSkipped ? ` · ${t("skipped")}: ${searchSkipped}` : "")
      : t("noResults") + (searchSkipped ? ` ${t("skipped")}: ${searchSkipped}` : "");
  } else {
    $("searchStatus").textContent = t("searchHint");
  }

  if (!searchedQuery && !searching) {
    const heading = document.createElement("div");
    heading.className = "recent-heading";
    heading.textContent = t("recentSearches");
    container.appendChild(heading);

    if (!state.searchHistory.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = t("noHistory");
      container.appendChild(empty);
    }

    state.searchHistory.forEach(query => {
      const button = document.createElement("button");
      button.className = "recent-query";
      button.textContent = query;
      button.onclick = () => {
        $("searchInput").value = query;
        runSearch(query);
      };
      container.appendChild(button);
    });
    return;
  }

  searchResults.forEach(result => {
    const button = document.createElement("button");
    button.className = "search-result";

    const title = document.createElement("div");
    title.className = "result-title";
    appendHighlightedText(title, result.title, searchedQuery);

    const snippet = document.createElement("div");
    snippet.className = "result-snippet";
    appendHighlightedText(snippet, result.excerpt, searchedQuery);

    button.append(title, snippet);
    if (result.count) {
      const count = document.createElement("div");
      count.className = "result-count";
      count.textContent = `${result.count} ${t("matches")}`;
      button.appendChild(count);
    }

    button.onclick = async () => {
      if (busy || navigating) return;
      const query = searchedQuery;
      container.querySelectorAll(".active").forEach(el => el.classList.remove("active"));
      button.classList.add("active");

      if (result.kind === "chm" && chm) {
        const entry = chm.entryMap.get(result.path.toLowerCase());
        if (entry) {
          try {
            showChmPage(chm, entry, "", {query, firstMatch:true});
          } catch (error) {
            toast(error.message);
          }
        }
      } else if (result.kind === "epub") {
        await navigateEpub(result.cfi, query);
      }
    };

    container.appendChild(button);
  });
}

async function runSearch(rawQuery, options = {}) {
  const query = String(rawQuery || "").trim().slice(0,200);
  if (!query) {
    clearSearch();
    return;
  }
  if (!activeSessionId || busy) {
    if (!activeSessionId) toast(t("openFirst"));
    return;
  }

  const token = ++searchToken;
  const session = activeSessionId;

  state.searchQuery = query;
  $("searchInput").value = query;
  if (options.remember !== false) rememberSearch(query);

  if (options.applyHighlight !== false) {
    state.highlightQuery = query;
    const item = state.nav[state.navIndex];
    if (item) item.query = query;
  }

  positionChanged();
  searching = true;
  searchedQuery = query;
  searchResults = [];
  searchSkipped = 0;
  searchLimited = false;
  renderSearchResults();

  const valid = () => token === searchToken && session === activeSessionId;

  try {
    const output = kind === "chm"
      ? await searchChm(query, valid)
      : await queueEpubSearch(query, valid);

    if (!valid()) return;
    searchResults = output.results;
    searchSkipped = output.skipped;
    searchLimited = output.limited;

    if (options.applyHighlight !== false) {
      if (chm && chmPageReady) {
        highlightDocument($("chm-frame").contentDocument, query, true);
        captureChmScroll();
        positionChanged();
      } else if (rendition) {
        applyEpubHighlights(output.results, query);
      }
    } else if (rendition && state.highlightQuery === query) {
      applyEpubHighlights(output.results, query);
    }
  } catch (error) {
    if (!valid()) return;
    console.error(error);
    toast(t("searchFailed") + ": " + error.message);
  } finally {
    if (valid()) {
      searching = false;
      renderSearchResults();
    }
  }
}

async function searchChm(query, valid) {
  const current = chm;
  const results = [];
  let skipped = 0;
  let limited = false;

  const entries = current.entries.filter(entry =>
    entry.name.startsWith("/") && /\.(html?|xhtml)$/i.test(entry.name)
  );

  for (let i = 0; i < entries.length; i++) {
    if (!valid() || chm !== current) break;
    const entry = entries[i];

    try {
      const doc = new DOMParser().parseFromString(current._text(entry), "text/html");
      const text = textMap(doc).text;
      const regex = queryRegExp(query);
      const first = regex.exec(text);

      if (first) {
        let count = 1;
        while (regex.exec(text)) count++;

        const start = Math.max(0, first.index - 75);
        const end = Math.min(text.length, first.index + first[0].length + 120);
        results.push({
          kind:"chm",
          path:entry.name,
          title:doc.title.trim() || entry.name.replace(/^\//,""),
          excerpt:(start ? "…" : "") + text.slice(start,end).replace(/\s+/g," ") +
            (end < text.length ? "…" : ""),
          count
        });

        if (results.length >= SEARCH_RESULT_LIMIT) {
          limited = true;
          break;
        }
      }
    } catch (error) {
      skipped++;
      console.warn("Search skipped", entry.name, error);
    }

    if (i % 8 === 0) {
      $("searchStatus").textContent = `${t("searching")} ${i + 1}/${entries.length}`;
      await pause();
    }
  }

  return {results, skipped, limited};
}

function queueEpubSearch(query, valid) {
  // Serialize searches because EPUB sections have shared loading state.
  const task = searchQueue.catch(() => {}).then(() => searchEpub(query, valid));
  searchQueue = task.catch(() => {});
  return task;
}

async function searchEpub(query, valid) {
  const currentBook = book;
  const results = [];
  let skipped = 0;
  let limited = false;
  if (!currentBook) return {results, skipped, limited};

  await currentBook.ready;
  const sections = currentBook.spine.spineItems;

  for (let i = 0; i < sections.length; i++) {
    if (!valid() || currentBook !== book) break;
    const section = sections[i];

    try {
      await section.load(currentBook.load.bind(currentBook));
      if (!valid() || currentBook !== book) break;

      const matches = section.find(query) || [];
      const title = section.document?.querySelector("title")?.textContent?.trim()
        || section.href;

      for (const hit of matches) {
        results.push({
          kind:"epub",
          cfi:hit.cfi,
          href:section.href,
          title,
          excerpt:hit.excerpt || query
        });
        if (results.length >= SEARCH_RESULT_LIMIT) {
          limited = true;
          break;
        }
      }
      if (limited) break;
    } catch (error) {
      skipped++;
      console.warn("Search skipped EPUB section", section.href, error);
    }

    // Keep section documents cached: unloading shared sections during
    // rendition navigation can invalidate another in-progress operation.
    if (i % 4 === 0) await pause();
  }

  return {results, skipped, limited};
}

function clearEpubHighlights() {
  if (rendition) {
    for (const cfi of epubHighlights) {
      try { rendition.annotations.remove(cfi, "highlight"); } catch (_) {}
    }
  }
  epubHighlights.clear();
}

function applyEpubHighlights(results, query) {
  if (!rendition || state.highlightQuery !== query) return;
  clearEpubHighlights();

  for (const result of results) {
    if (result.kind !== "epub" || epubHighlights.has(result.cfi)) continue;
    try {
      rendition.annotations.highlight(
        result.cfi,
        {search:query},
        null,
        "reader-search-highlight",
        {"fill":"#ffd43b", "fill-opacity":"0.5", "mix-blend-mode":"multiply"}
      );
      epubHighlights.add(result.cfi);
    } catch (error) {
      console.warn("Highlight:", error);
    }
  }
}

async function highlightEpubQuery(query) {
  if (!rendition) return;
  if (!query) {
    clearEpubHighlights();
    return;
  }
  if (searchedQuery === query && !searching && searchResults.length) {
    applyEpubHighlights(searchResults, query);
    return;
  }

  const session = activeSessionId;
  const valid = () => session === activeSessionId && state.highlightQuery === query;
  const result = await queueEpubSearch(query, valid);
  if (valid()) applyEpubHighlights(result.results, query);
}

function clearSearch() {
  searchToken++;
  searching = false;
  searchResults = [];
  searchedQuery = "";
  state.searchQuery = "";
  state.highlightQuery = "";
  $("searchInput").value = "";

  const item = state.nav[state.navIndex];
  if (item) item.query = "";

  if (chm && chmPageReady) {
    clearDocumentHighlights($("chm-frame").contentDocument);
  }
  clearEpubHighlights();
  positionChanged();
  saveState();
  renderSearchResults();
}

$("searchForm").onsubmit = event => {
  event.preventDefault();
  runSearch($("searchInput").value);
};
$("clearSearch").onclick = clearSearch;
$("clearSearchHistory").onclick = () => {
  state.searchHistory = [];
  saveState();
  renderSearchResults();
};

/* ===================================================================
   CHM BINARY READER / DIRECTORY
=================================================================== */

function checkRange(total, offset, length, label = "Data") {
  if (
    !Number.isSafeInteger(offset) || !Number.isSafeInteger(length) ||
    offset < 0 || length < 0 || offset > total || length > total - offset
  ) throw new Error(label + " is outside file bounds");
}

class Reader {
  constructor(data) {
    this.u8 = data instanceof ArrayBuffer ? new Uint8Array(data) : data;
    this.dv = new DataView(this.u8.buffer, this.u8.byteOffset, this.u8.byteLength);
    this.p = 0;
  }
  need(n) { checkRange(this.u8.length, this.p, n, "Binary read"); }
  bytes(n) {
    this.need(n);
    const result = this.u8.subarray(this.p, this.p + n);
    this.p += n;
    return result;
  }
  byte() { this.need(1); return this.u8[this.p++]; }
  u16() {
    this.need(2);
    const value = this.dv.getUint16(this.p,true);
    this.p += 2;
    return value;
  }
  u32() {
    this.need(4);
    const value = this.dv.getUint32(this.p,true);
    this.p += 4;
    return value;
  }
  u64() {
    const low = this.u32(), high = this.u32();
    const value = high * 4294967296 + low;
    if (!Number.isSafeInteger(value)) throw new Error("Unsafe 64-bit value");
    return value;
  }
  skip(n) { this.need(n); this.p += n; }
  str(n) {
    let result = "";
    for (const byte of this.bytes(n)) result += String.fromCharCode(byte);
    return result;
  }
}

function readENCINT(data, cursor, end) {
  let value = 0;
  for (let i = 0; i < 9; i++) {
    if (cursor.p >= end) throw new Error("Truncated CHM directory integer");
    const byte = data[cursor.p++];
    value = value * 128 + (byte & 127);
    if (!Number.isSafeInteger(value)) throw new Error("CHM integer too large");
    if (!(byte & 128)) return value;
  }
  throw new Error("Invalid CHM directory integer");
}

function parseCHM(data) {
  const reader = new Reader(data);
  if (reader.str(4) !== "ITSF") throw new Error("Not an ITSF (CHM) file");

  const version = reader.u32();
  const headerLength = reader.u32();
  if (version !== 2 && version !== 3) throw new Error("Unsupported ITSF version");
  if (headerLength < (version === 3 ? 0x60 : 0x58)) throw new Error("Invalid ITSF header");

  reader.skip(12);
  reader.skip(32);
  reader.u64();
  reader.u64();
  const directoryOffset = reader.u64();
  const directoryLength = reader.u64();
  const contentOffset = version >= 3 ? reader.u64() : directoryOffset + directoryLength;

  checkRange(data.length,directoryOffset,directoryLength,"CHM directory");
  checkRange(data.length,contentOffset,0,"CHM content");

  const directory = new Reader(data.subarray(directoryOffset,directoryOffset + directoryLength));
  if (directory.str(4) !== "ITSP") throw new Error("Not an ITSP directory");
  directory.u32();
  const directoryHeaderLength = directory.u32();
  directory.u32();
  const chunkSize = directory.u32();
  directory.skip(24);
  const chunkCount = directory.u32();

  if (directoryHeaderLength < 0x30 || chunkSize < 20) throw new Error("Invalid CHM directory geometry");
  checkRange(directoryLength,directoryHeaderLength,chunkCount * chunkSize,"Directory chunks");

  const entries = [];
  const decoder = new TextDecoder("utf-8");
  const baseOffset = directoryOffset + directoryHeaderLength;
  const view = new DataView(data.buffer,data.byteOffset,data.byteLength);

  for (let index = 0; index < chunkCount; index++) {
    const base = baseOffset + index * chunkSize;
    const signature = String.fromCharCode(...data.subarray(base,base + 4));
    if (signature !== "PMGL") continue;
    const freeSpace = view.getUint32(base + 4,true);
    if (freeSpace > chunkSize - 20) throw new Error("Invalid PMGL free space");
    const end = base + chunkSize - freeSpace;
    const cursor = {p:base + 20};

    while (cursor.p < end) {
      const nameLength = readENCINT(data,cursor,end);
      if (!nameLength || nameLength > end - cursor.p) throw new Error("Invalid directory filename");
      const name = decoder.decode(data.subarray(cursor.p,cursor.p + nameLength));
      cursor.p += nameLength;
      entries.push({
        name,
        section:readENCINT(data,cursor,end),
        offset:readENCINT(data,cursor,end),
        length:readENCINT(data,cursor,end)
      });
    }
  }

  return {
    _u8:data,
    entries,
    entryMap:new Map(entries.map(entry => [entry.name.toLowerCase(),entry])),
    contentOffset,
    _urlCache:new Map()
  };
}

function readUncompressed(object, entry) {
  if (entry.section !== 0) throw new Error("Expected uncompressed entry: " + entry.name);
  const start = object.contentOffset + entry.offset;
  checkRange(object._u8.length,start,entry.length,entry.name);
  return object._u8.subarray(start,start + entry.length);
}

/* ===================================================================
   LZX DECODER
   Pending matches are preserved across output-frame boundaries.
=================================================================== */

const LZX = (() => {
  const FRAME_SIZE = 0x8000;
  const NUM_CHARS = 256;
  const LENGTHS = 249;
  const VERBATIM = 1, ALIGNED = 2, RAW = 3;
  const SLOTS = {15:30,16:32,17:34,18:36,19:38,20:42,21:50};
  const EXTRA = new Uint8Array(51);
  const BASE = new Uint32Array(51);

  for (let i = 0; i < 51; i++) {
    EXTRA[i] = i < 4 ? 0 : Math.min(17,Math.floor(i / 2) - 1);
    if (i) BASE[i] = BASE[i - 1] + 2 ** EXTRA[i - 1];
  }

  class BitReader {
    constructor(data) {
      this.data = data;
      this.pos = 0;
      this.word = 0;
      this.bitsLeft = 0;
    }
    need(n) {
      if (n < 0 || n > this.data.length - this.pos) {
        throw new Error("Truncated LZX frame at compressed byte " + this.pos);
      }
    }
    read(n) {
      if (!Number.isInteger(n) || n < 0 || n > 32) throw new Error("Invalid bit count");
      let result = 0;
      while (n > 0) {
        if (!this.bitsLeft) {
          this.need(2);
          this.word = this.data[this.pos] | (this.data[this.pos + 1] << 8);
          this.pos += 2;
          this.bitsLeft = 16;
        }
        const take = Math.min(n,this.bitsLeft);
        const shift = this.bitsLeft - take;
        const mask = take === 16 ? 0xffff : (1 << take) - 1;
        result = result * 2 ** take + ((this.word >>> shift) & mask);
        this.bitsLeft -= take;
        n -= take;
        this.word &= this.bitsLeft ? (1 << this.bitsLeft) - 1 : 0;
      }
      return result;
    }
    alignFrame() { this.word = 0; this.bitsLeft = 0; }
    beginRawBlock() {
      if (!this.bitsLeft) { this.need(2); this.pos += 2; }
      this.word = 0;
      this.bitsLeft = 0;
    }
    rawByte() {
      if (this.bitsLeft) throw new Error("Unaligned raw read");
      this.need(1);
      return this.data[this.pos++];
    }
    rawU32() {
      if (this.bitsLeft) throw new Error("Unaligned raw DWORD");
      this.need(4);
      const p = this.pos;
      this.pos += 4;
      return (
        this.data[p] + this.data[p + 1] * 256 +
        this.data[p + 2] * 65536 + this.data[p + 3] * 16777216
      ) >>> 0;
    }
  }

  function buildTree(lengths) {
    const counts = new Uint32Array(17);
    let max = 0;
    for (const length of lengths) {
      if (length > 16) throw new Error("Invalid Huffman length");
      if (length) { counts[length]++; max = Math.max(max,length); }
    }
    const firstCode = new Uint32Array(17);
    const firstSymbol = new Uint32Array(17);
    let code = 0, total = 0;
    for (let length = 1; length <= 16; length++) {
      code = (code + counts[length - 1]) * 2;
      if (code + counts[length] > 2 ** length) throw new Error("Oversubscribed Huffman tree");
      firstCode[length] = code;
      firstSymbol[length] = total;
      total += counts[length];
    }
    const symbols = new Uint16Array(total);
    const next = firstSymbol.slice();
    for (let symbol = 0; symbol < lengths.length; symbol++) {
      const length = lengths[symbol];
      if (length) symbols[next[length]++] = symbol;
    }
    return {counts,firstCode,firstSymbol,symbols,max};
  }

  function decodeSymbol(reader, tree) {
    if (!tree?.max) throw new Error("Empty LZX Huffman tree");
    let code = 0;
    for (let length = 1; length <= tree.max; length++) {
      code = code * 2 + reader.read(1);
      const offset = code - tree.firstCode[length];
      if (offset >= 0 && offset < tree.counts[length]) {
        return tree.symbols[tree.firstSymbol[length] + offset];
      }
    }
    throw new Error("Invalid LZX Huffman code");
  }

  function readLengths(reader, lengths, first, last) {
    const pretreeLengths = new Uint8Array(20);
    for (let i = 0; i < 20; i++) pretreeLengths[i] = reader.read(4);
    const pretree = buildTree(pretreeLengths);
    let index = first;

    while (index < last) {
      const symbol = decodeSymbol(reader,pretree);
      let count, value;
      if (symbol === 17) {
        count = reader.read(4) + 4;
        value = 0;
      } else if (symbol === 18) {
        count = reader.read(5) + 20;
        value = 0;
      } else if (symbol === 19) {
        count = reader.read(1) + 4;
        const delta = decodeSymbol(reader,pretree);
        if (delta > 16) throw new Error("Invalid code-length delta");
        value = (lengths[index] - delta + 17) % 17;
      } else {
        count = 1;
        value = (lengths[index] - symbol + 17) % 17;
      }
      if (count > last - index) throw new Error("Code-length run exceeds tree");
      lengths.fill(value,index,index + count);
      index += count;
    }
  }

  class Decoder {
    constructor(bits) {
      if (!SLOTS[bits]) throw new Error("Unsupported LZX window");
      this.windowSize = 2 ** bits;
      this.mask = this.windowSize - 1;
      this.window = new Uint8Array(this.windowSize);
      this.slots = SLOTS[bits];
      this.mainElements = NUM_CHARS + this.slots * 8;
      this.mainLengths = new Uint8Array(this.mainElements);
      this.lengthLengths = new Uint8Array(LENGTHS);
      this.alignedLengths = new Uint8Array(8);
      this.pendingMatchLength = 0;
      this.reset();
    }
    reset() {
      if (this.pendingMatchLength > 0) {
        throw new Error("LZX reset interrupts unfinished match");
      }
      this.window.fill(0);
      this.windowPosition = 0;
      this.R0 = this.R1 = this.R2 = 1;
      this.headerRead = false;
      this.blockType = this.blockLength = this.blockRemaining = 0;
      this.pendingMatchLength = this.pendingMatchOffset = 0;
      this.rawPaddingPending = false;
      this.mainLengths.fill(0);
      this.lengthLengths.fill(0);
      this.alignedLengths.fill(0);
      this.mainTree = this.lengthTree = this.alignedTree = null;
      this.intelFileSize = 0;
      this.intelStarted = false;
    }
    readHeader(reader) {
      if (reader.read(1)) {
        this.intelFileSize = (reader.read(16) * 65536 + reader.read(16)) | 0;
      } else this.intelFileSize = 0;
      this.headerRead = true;
    }
    startBlock(reader) {
      if (this.pendingMatchLength) throw new Error("Pending match at block start");
      if (this.rawPaddingPending) {
        reader.rawByte();
        this.rawPaddingPending = false;
      }
      this.blockType = reader.read(3);
      this.blockLength = reader.read(16) * 256 + reader.read(8);
      this.blockRemaining = this.blockLength;
      if (![VERBATIM,ALIGNED,RAW].includes(this.blockType)) throw new Error("Invalid LZX block type");
      if (!this.blockLength) throw new Error("Zero-length LZX block");

      if (this.blockType === ALIGNED) {
        for (let i = 0; i < 8; i++) this.alignedLengths[i] = reader.read(3);
        this.alignedTree = buildTree(this.alignedLengths);
      }

      if (this.blockType === VERBATIM || this.blockType === ALIGNED) {
        readLengths(reader,this.mainLengths,0,NUM_CHARS);
        readLengths(reader,this.mainLengths,NUM_CHARS,this.mainElements);
        this.mainTree = buildTree(this.mainLengths);
        if (this.mainLengths[0xe8]) this.intelStarted = true;
        readLengths(reader,this.lengthLengths,0,LENGTHS);
        this.lengthTree = buildTree(this.lengthLengths);
      } else {
        this.intelStarted = true;
        reader.beginRawBlock();
        this.R0 = reader.rawU32();
        this.R1 = reader.rawU32();
        this.R2 = reader.rawU32();
        for (const offset of [this.R0,this.R1,this.R2]) {
          if (offset < 1 || offset > this.windowSize) throw new Error("Invalid repeated match offset");
        }
      }
    }
    readOffset(reader, slot) {
      let offset;
      if (slot === 0) return this.R0;
      if (slot === 1) {
        offset = this.R1;
        this.R1 = this.R0;
        this.R0 = offset;
        return offset;
      }
      if (slot === 2) {
        offset = this.R2;
        this.R2 = this.R0;
        this.R0 = offset;
        return offset;
      }
      if (slot >= this.slots) throw new Error("Invalid position slot");
      const extra = EXTRA[slot];
      offset = BASE[slot] - 2;
      if (this.blockType === ALIGNED && extra >= 3) {
        if (extra > 3) offset += reader.read(extra - 3) * 8;
        offset += decodeSymbol(reader,this.alignedTree);
      } else if (extra > 0) offset += reader.read(extra);
      this.R2 = this.R1;
      this.R1 = this.R0;
      this.R0 = offset;
      return offset;
    }
    copyPending(output, position) {
      const count = Math.min(this.pendingMatchLength,output.length - position);
      if (count > this.blockRemaining) throw new Error("Pending match exceeds block");

      for (let i = 0; i < count; i++) {
        const source = (this.windowPosition - this.pendingMatchOffset) & this.mask;
        const value = this.window[source];
        this.window[this.windowPosition] = value;
        this.windowPosition = (this.windowPosition + 1) & this.mask;
        output[position++] = value;
      }

      this.pendingMatchLength -= count;
      this.blockRemaining -= count;
      if (!this.pendingMatchLength) this.pendingMatchOffset = 0;
      return position;
    }
    decodeFrame(input, length, absoluteOffset, frameNumber) {
      if (!Number.isInteger(length) || length < 1 || length > FRAME_SIZE) {
        throw new Error("Invalid output frame length");
      }
      const reader = new BitReader(input);
      const output = new Uint8Array(length);
      let position = 0;

      if (!this.headerRead) this.readHeader(reader);

      while (position < length) {
        if (this.pendingMatchLength) {
          position = this.copyPending(output,position);
          continue;
        }
        if (!this.blockRemaining) this.startBlock(reader);

        if (this.blockType === RAW) {
          const count = Math.min(this.blockRemaining,length - position);
          reader.need(count);
          for (let i = 0; i < count; i++) {
            const value = reader.rawByte();
            this.window[this.windowPosition] = value;
            this.windowPosition = (this.windowPosition + 1) & this.mask;
            output[position++] = value;
          }
          this.blockRemaining -= count;
          if (!this.blockRemaining && (this.blockLength & 1)) this.rawPaddingPending = true;
          continue;
        }

        const symbol = decodeSymbol(reader,this.mainTree);
        if (symbol < NUM_CHARS) {
          this.window[this.windowPosition] = symbol;
          this.windowPosition = (this.windowPosition + 1) & this.mask;
          output[position++] = symbol;
          this.blockRemaining--;
          continue;
        }

        const match = symbol - NUM_CHARS;
        const primary = match & 7;
        let matchLength = primary + 2;
        if (primary === 7) matchLength += decodeSymbol(reader,this.lengthTree);
        if (matchLength > this.blockRemaining) {
          throw new Error("LZX match exceeds block length");
        }
        const offset = this.readOffset(reader,match >>> 3);
        if (offset < 1 || offset > this.windowSize) throw new Error("Match offset outside dictionary");
        this.pendingMatchLength = matchLength;
        this.pendingMatchOffset = offset;
      }

      if (this.rawPaddingPending && !reader.bitsLeft && reader.pos < input.length) {
        reader.rawByte();
        this.rawPaddingPending = false;
      }
      reader.alignFrame();
      this.translateIntel(output,absoluteOffset,frameNumber);
      return output;
    }
    translateIntel(output,absoluteOffset,frameNumber) {
      if (!this.intelStarted || !this.intelFileSize || frameNumber >= 32768 || output.length <= 10) return;
      const view = new DataView(output.buffer,output.byteOffset,output.byteLength);
      let position = 0;
      while (position < output.length - 10) {
        if (output[position] !== 0xe8) { position++; continue; }
        const current = absoluteOffset + position;
        const absolute = view.getInt32(position + 1,true);
        if (absolute >= -current && absolute < this.intelFileSize) {
          view.setInt32(
            position + 1,
            absolute >= 0 ? absolute - current : absolute + this.intelFileSize,
            true
          );
        }
        position += 5;
      }
    }
  }

  return {Decoder,FRAME_SIZE};
})();

async function getLZXContent(object) {
  const prefix = "::DataSpace/Storage/MSCompressed/";
  const find = name => object.entryMap.get(name.toLowerCase());
  const content = find(prefix + "Content");
  const control = find(prefix + "ControlData");
  const resetTable =
    find(prefix + "Transform/{7FC28940-9D31-11D0-9B27-00A0C91E9C7C}/InstanceData/ResetTable") ||
    object.entries.find(entry =>
      entry.name.toLowerCase().startsWith(prefix.toLowerCase()) &&
      entry.name.toLowerCase().endsWith("/instancedata/resettable")
    );

  if (!object.entries.some(entry => entry.section === 1 && entry.length > 0)) return null;
  if (!content || !control || !resetTable) throw new Error("Missing LZX stream metadata");

  const cr = new Reader(readUncompressed(object,control));
  cr.u32();
  if (cr.str(4) !== "LZXC") throw new Error("Invalid LZXC signature");
  const version = cr.u32();
  let resetInterval = cr.u32();
  let windowSize = cr.u32();
  cr.u32();

  if (version === 2) {
    resetInterval *= LZX.FRAME_SIZE;
    windowSize *= LZX.FRAME_SIZE;
  } else if (version !== 1) throw new Error("Unsupported LZXC version");

  const bits = Math.log2(windowSize);
  if (!Number.isInteger(bits) || bits < 15 || bits > 21) throw new Error("Invalid LZX window size");
  if (
    !Number.isSafeInteger(resetInterval) ||
    resetInterval < LZX.FRAME_SIZE ||
    resetInterval % LZX.FRAME_SIZE
  ) throw new Error("Invalid reset interval");

  const rr = new Reader(readUncompressed(object,resetTable));
  const resetVersion = rr.u32();
  const blockCount = rr.u32();
  const entrySize = rr.u32();
  const tableOffset = rr.u32();
  const uncompressedLength = rr.u64();
  const compressedLength = rr.u64();
  const frameLength = rr.u64();

  if (resetVersion !== 2 || entrySize !== 8 || tableOffset < 0x28) {
    throw new Error("Unsupported LZX reset table");
  }
  if (frameLength !== LZX.FRAME_SIZE) throw new Error("Unsupported frame length");
  checkRange(rr.u8.length,tableOffset,blockCount * entrySize,"Reset offsets");

  const compressed = readUncompressed(object,content);
  if (compressedLength > compressed.length) throw new Error("Compressed length exceeds Content");

  const frameCount = Math.ceil(uncompressedLength / frameLength);
  if (blockCount < frameCount) throw new Error("Insufficient frame offsets");
  if (!uncompressedLength) return {data:new Uint8Array(0)};
  if (uncompressedLength > 512 * 1024 * 1024) throw new Error("CHM content exceeds the 512 MiB limit");

  rr.p = tableOffset;
  const offsets = [];
  for (let i = 0; i < frameCount; i++) {
    const offset = rr.u64();
    if (offset > compressedLength || (i && offset < offsets[i - 1])) {
      throw new Error("Invalid frame offset");
    }
    offsets.push(offset);
  }
  if (offsets[0] !== 0) throw new Error("First LZX offset is not zero");

  const output = new Uint8Array(uncompressedLength);
  const decoder = new LZX.Decoder(bits);
  const framesPerReset = resetInterval / frameLength;
  let outputPosition = 0;

  for (let i = 0; i < frameCount; i++) {
    const start = offsets[i];
    const end = i + 1 < frameCount ? offsets[i + 1] : compressedLength;
    const length = Math.min(frameLength,uncompressedLength - outputPosition);
    try {
      if (i && i % framesPerReset === 0) decoder.reset();
      output.set(
        decoder.decodeFrame(compressed.subarray(start,end),length,outputPosition,i),
        outputPosition
      );
    } catch (error) {
      throw new Error(
        `LZX frame ${i}, compressed offset 0x${start.toString(16)}: ${error.message}`
      );
    }
    outputPosition += length;
    if ((i & 31) === 31) {
      $("loaderDetail").textContent = Math.round(outputPosition / uncompressedLength * 100) + "%";
      await pause();
    }
  }

  return {data:output};
}

function readEntry(object,decompressed,entry) {
  if (entry.section === 0) return readUncompressed(object,entry);
  if (entry.section !== 1) throw new Error("Unsupported CHM content section");
  if (!entry.length) return new Uint8Array(0);
  if (!decompressed) throw new Error("Missing decompressed content");
  checkRange(decompressed.data.length,entry.offset,entry.length,entry.name);
  return decompressed.data.subarray(entry.offset,entry.offset + entry.length);
}

/* ===================================================================
   CHM ENCODING / METADATA / CONTENTS
=================================================================== */

function getSystemRecords(object) {
  const records = new Map();
  const entry = object.entryMap.get("/#system");
  if (!entry) return records;
  const data = object._read(entry);
  if (data.length < 4) return records;
  const reader = new Reader(data);
  reader.u32();
  while (reader.p + 4 <= data.length) {
    const code = reader.u16();
    const length = reader.u16();
    records.set(code,reader.bytes(length));
  }
  return records;
}

function defaultEncoding(records) {
  const info = records.get(4);
  if (info?.length >= 4) {
    const locale = new DataView(info.buffer,info.byteOffset,info.byteLength).getUint32(0,true);
    const language = locale & 0x3ff;
    if ([2,0x19,0x22,0x23,0x2f].includes(language)) return "windows-1251";
    if ([5,0x0e,0x15,0x18,0x1a,0x1b,0x24].includes(language)) return "windows-1250";
    if (language === 8) return "windows-1253";
    if (language === 0x1f) return "windows-1254";
    if (language === 0x0d) return "windows-1255";
    if (language === 1) return "windows-1256";
    if (language === 0x11) return "shift_jis";
    if (language === 0x12) return "euc-kr";
    if (language === 4) return [0x0404,0x0c04,0x1404].includes(locale) ? "big5" : "gb18030";
  }
  return "windows-1252";
}

function decodeText(data,fallback = "windows-1252") {
  if (data[0] === 0xff && data[1] === 0xfe) return new TextDecoder("utf-16le").decode(data);
  if (data[0] === 0xfe && data[1] === 0xff) return new TextDecoder("utf-16be").decode(data);
  if (data[0] === 0xef && data[1] === 0xbb && data[2] === 0xbf) return new TextDecoder("utf-8").decode(data);

  const sample = new TextDecoder("windows-1252").decode(data.subarray(0,8192));
  const declaration =
    sample.match(/<meta\b[^>]*charset\s*=\s*["']?\s*([a-z0-9._-]+)/i) ||
    sample.match(/<\?xml\b[^>]*encoding\s*=\s*["']([^"']+)/i) ||
    sample.match(/@charset\s+["']([^"']+)/i);

  if (declaration) {
    try { return new TextDecoder(declaration[1]).decode(data); } catch (_) {}
  }
  try { return new TextDecoder("utf-8",{fatal:true}).decode(data); }
  catch (_) { return new TextDecoder(fallback).decode(data); }
}

function systemString(object,code) {
  const bytes = object._system.get(code);
  if (!bytes) return "";
  const end = bytes.indexOf(0);
  return decodeText(end >= 0 ? bytes.subarray(0,end) : bytes,object._encoding).trim();
}

function resolveChmLink(object,href,baseName = "/") {
  if (!href) return null;
  href = href.trim().replace(/\\/g,"/");
  const separator = href.indexOf("::");
  if (separator >= 0) href = href.slice(separator + 2);
  if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("//")) return null;

  try {
    const url = new URL(href,new URL(baseName,"https://chm.invalid/"));
    let path = url.pathname;
    try { path = decodeURIComponent(path); } catch (_) {}
    const entry = object.entryMap.get(path.toLowerCase());
    return entry ? {entry,hash:url.hash} : null;
  } catch (_) {
    return null;
  }
}

async function openChm(data) {
  const restore = {
    path:state.chmPath,
    hash:state.chmHash,
    scroll:state.chmScroll,
    query:state.highlightQuery
  };

  const object = parseCHM(new Uint8Array(data));
  const decompressed = await getLZXContent(object);
  object._read = entry => readEntry(object,decompressed,entry);
  object._system = getSystemRecords(object);
  object._encoding = defaultEncoding(object._system);
  object._text = entry => decodeText(object._read(entry),object._encoding);
  chm = object;

  $("dropZone").style.display = "none";
  $("chm-content").classList.add("active");
  buildChmToc(object);

  const savedEntry = restore.path && object.entryMap.get(restore.path.toLowerCase());
  if (savedEntry) {
    showChmPage(object,savedEntry,restore.hash,{
      scrollTop:restore.scroll,
      query:restore.query,
      historyMode:state.nav.length ? "replace" : "push"
    });
  } else {
    const home = resolveChmLink(object,systemString(object,2));
    const entry = home?.entry || object.entries.find(item =>
      item.name.startsWith("/") && /\.html?$/i.test(item.name)
    );

    if (entry) {
      showChmPage(object,entry,home?.hash || "",{query:""});
    } else {
      $("chm-frame").srcdoc = "<!doctype html><p>No HTML articles found.</p>";
    }
  }
  scrollSelectedToc();
}

function parseHHC(html) {
  const doc = new DOMParser().parseFromString(html,"text/html");
  const items = [];

  doc.querySelectorAll("object").forEach(object => {
    let label = "", href = "";
    object.querySelectorAll("param").forEach(param => {
      const name = (param.getAttribute("name") || "").toLowerCase();
      const value = param.getAttribute("value") || "";
      if (name === "name" && !label) label = value;
      if (name === "local") href = value;
    });
    if (!label && !href) return;
    let level = -1, parent = object.parentElement;
    while (parent) {
      if (parent.tagName === "UL") level++;
      parent = parent.parentElement;
    }
    items.push({label:label || href,href,level:Math.max(0,level)});
  });
  return items;
}

function buildChmToc(object) {
  $("tocList").replaceChildren();
  const target = resolveChmLink(object,systemString(object,0));
  const hhc = target?.entry || object.entries.find(entry => /\.hhc$/i.test(entry.name));
  let items = [];
  if (hhc) {
    try { items = parseHHC(object._text(hhc)); } catch (error) { console.warn(error); }
  }
  if (!items.length) {
    items = object.entries.filter(entry =>
      entry.name.startsWith("/") && /\.html?$/i.test(entry.name)
    ).map(entry => ({label:entry.name.replace(/^\//,""),href:entry.name,level:0}));
  }

  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = t("noToc");
    $("tocList").appendChild(empty);
  }

  items.forEach(item => {
    const button = document.createElement("button");
    button.className = "toc-item" + (item.level ? " sub" : "");
    button.style.paddingLeft = Math.min(100,14 + item.level * 16) + "px";
    button.textContent = item.label;
    button.title = item.label;
    const link = resolveChmLink(object,item.href,hhc?.name || "/");
    if (link) {
      button.dataset.path = link.entry.name.toLowerCase();
      button.dataset.hash = link.hash;
    }
    button.onclick = () => {
      if (busy || navigating || !item.href) return;
      if (!link) { toast(t("missingPage") + ": " + item.href); return; }
      try { showChmPage(object,link.entry,link.hash); }
      catch (error) { toast(error.message); }
    };
    $("tocList").appendChild(button);
  });
}

function highlightChmToc(entry,hash = "") {
  const items = [...$("tocList").querySelectorAll(".toc-item")];
  const path = entry.name.toLowerCase();
  const selected = items.find(item =>
    item.dataset.path === path && (item.dataset.hash || "") === hash
  ) || items.find(item => item.dataset.path === path);
  items.forEach(item => item.classList.toggle("active",item === selected));
}

function scrollSelectedToc() {
  $("tocList").querySelector(".active")?.scrollIntoView({block:"nearest"});
}

/* ===================================================================
   CHM RESOURCE REWRITING / ARTICLE DISPLAY
=================================================================== */

function mimeFor(path) {
  const types = {
    html:"text/html",htm:"text/html",xhtml:"application/xhtml+xml",
    png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",
    svg:"image/svg+xml",bmp:"image/bmp",webp:"image/webp",ico:"image/x-icon",
    css:"text/css",woff:"font/woff",woff2:"font/woff2",ttf:"font/ttf",
    otf:"font/otf",mp3:"audio/mpeg",wav:"audio/wav",mp4:"video/mp4"
  };
  return types[path.toLowerCase().split(".").pop()] || "application/octet-stream";
}

function resourceURL(object,entry,active = new Set()) {
  const key = entry.name.toLowerCase();
  if (object._urlCache.has(key)) return object._urlCache.get(key);
  if (active.has(key)) return null;
  active.add(key);
  try {
    const contents = /\.css$/i.test(entry.name)
      ? rewriteCss(object,object._text(entry),entry.name,active)
      : object._read(entry).slice();
    const url = URL.createObjectURL(new Blob([contents],{type:mimeFor(entry.name)}));
    object._urlCache.set(key,url);
    return url;
  } finally {
    active.delete(key);
  }
}

function rewriteReference(object,href,base,active = new Set()) {
  const target = resolveChmLink(object,href,base);
  if (!target) return href;
  const url = resourceURL(object,target.entry,active);
  return url ? url + target.hash : href;
}

function rewriteCss(object,css,base,active = new Set()) {
  css = css.replace(
    /url\(\s*(?:"([^"]*)"|'([^']*)'|([^)\s]+))\s*\)/gi,
    (match,a,b,c) => {
      const href = a ?? b ?? c ?? "";
      if (!href || href.startsWith("#")) return match;
      return `url("${rewriteReference(object,href,base,active).replace(/"/g,"%22")}")`;
    }
  );
  return css.replace(
    /(@import\s+)(["'])([^"']+)\2/gi,
    (match,prefix,quote,href) => prefix + quote + rewriteReference(object,href,base,active) + quote
  );
}

function showChmPage(object,entry,hash = "",options = {}) {
  const doc = new DOMParser().parseFromString(object._text(entry),"text/html");

  doc.querySelectorAll("script,iframe,object,embed,base").forEach(el => el.remove());
  doc.querySelectorAll("meta[http-equiv]").forEach(el => {
    if (/^(refresh|content-security-policy)$/i.test(el.getAttribute("http-equiv"))) el.remove();
  });
  doc.querySelectorAll("*").forEach(el => {
    for (const attr of [...el.attributes]) {
      if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
    }
  });
  for (const attribute of ["src","background"]) {
    doc.querySelectorAll(`[${attribute}]`).forEach(el => {
      el.setAttribute(attribute,rewriteReference(object,el.getAttribute(attribute),entry.name));
    });
  }
  doc.querySelectorAll("link[href]").forEach(el => {
    el.setAttribute("href",rewriteReference(object,el.getAttribute("href"),entry.name));
  });
  doc.querySelectorAll("style").forEach(el => {
    el.textContent = rewriteCss(object,el.textContent,entry.name);
  });
  doc.querySelectorAll("[style]").forEach(el => {
    el.setAttribute("style",rewriteCss(object,el.getAttribute("style"),entry.name));
  });

  const style = doc.createElement("style");
  style.textContent = `
    html { font-size:${state.fontSize}%; scroll-behavior:auto!important; }
    body {
      font-family:Georgia,serif; line-height:1.65; padding:28px;
      max-width:1000px; margin:0 auto; color:#222;
      overflow-wrap:break-word;
    }
    img,svg,video { max-width:100%; height:auto; }
    pre { overflow:auto; }
    mark[data-reader-search] { background:#ffe66d!important; color:#111!important; }
  `;
  doc.head.appendChild(style);

  captureChmScroll();
  clearTimeout(scrollTimer);
  chmPageReady = false;
  const token = ++pageToken;
  const session = activeSessionId;
  const query = options.query !== undefined ? options.query : state.highlightQuery;
  const savedScroll = Number.isFinite(options.scrollTop);
  const scrollTop = savedScroll ? Math.max(0,options.scrollTop) : 0;

  state.chmPath = entry.name;
  state.chmHash = hash || "";
  state.chmScroll = scrollTop;
  state.highlightQuery = query || "";
  state.cfi = null;

  recordNavigation({
    kind:"chm",
    path:entry.name,
    hash:state.chmHash,
    scroll:scrollTop,
    query:state.highlightQuery
  },options.historyMode || "push");

  object._currentEntry = entry;
  highlightChmToc(entry,hash);
  doc.documentElement.dataset.readerToken = String(token);

  const frame = $("chm-frame");
  frame.onload = () => {
    if (object !== chm || token !== pageToken || session !== activeSessionId) return;
    const loaded = frame.contentDocument;
    if (loaded?.documentElement.dataset.readerToken !== String(token)) return;

    const win = loaded.defaultView;
    loaded.documentElement.style.fontSize = state.fontSize + "%";
    highlightDocument(loaded,query || "");

    loaded.addEventListener("click",event => {
      const anchor = event.target.closest?.("a[href],area[href]");
      if (!anchor) return;
      event.preventDefault();
      if (busy || navigating) return;
      const href = anchor.getAttribute("href") || "";

      if (/^(https?:|mailto:)/i.test(href)) {
        window.open(href,"_blank","noopener,noreferrer");
        return;
      }
      if (href.startsWith("#")) {
        captureChmScroll();
        state.chmHash = href;
        scrollToAnchor(loaded,href);
        captureChmScroll();
        recordNavigation({
          kind:"chm",path:entry.name,hash:href,
          scroll:state.chmScroll,query:state.highlightQuery
        });
        highlightChmToc(entry,href);
        return;
      }
      const target = resolveChmLink(object,href,entry.name);
      if (target) {
        try { showChmPage(object,target.entry,target.hash); }
        catch (error) { toast(error.message); }
      } else toast(t("missingPage") + ": " + href);
    });

    loaded.addEventListener("keyup",onReaderKey);

    win.requestAnimationFrame(() => {
      if (token !== pageToken || session !== activeSessionId) return;
      if (savedScroll) {
        win.scrollTo(0,scrollTop);
      } else if (options.firstMatch && query) {
        loaded.querySelector("mark[data-reader-search]")?.scrollIntoView({block:"center"});
      } else if (hash) {
        scrollToAnchor(loaded,hash);
      } else {
        win.scrollTo(0,0);
      }

      chmPageReady = true;
      captureChmScroll();
      positionChanged();

      win.addEventListener("scroll",() => {
        if (!chmPageReady || token !== pageToken || session !== activeSessionId) return;
        captureChmScroll();
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(positionChanged,120);
      },{passive:true});
    });
  };

  frame.srcdoc = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
}

function scrollToAnchor(doc,hash) {
  let id = hash.replace(/^#/,"");
  try { id = decodeURIComponent(id); } catch (_) {}
  if (!id) {
    doc.defaultView.scrollTo(0,0);
    return;
  }
  const target = doc.getElementById(id) || doc.getElementsByName(id)[0];
  target?.scrollIntoView();
}

/* ===================================================================
   UI / KEYBOARD
=================================================================== */

function applyFontSize() {
  if (rendition) rendition.themes.fontSize(state.fontSize + "%");
  if (chm) {
    try {
      $("chm-frame").contentDocument.documentElement.style.fontSize = state.fontSize + "%";
    } catch (_) {}
  }
  saveState();
}

$("fontDown").onclick = () => {
  state.fontSize = Math.max(60,state.fontSize - 10);
  applyFontSize();
};
$("fontUp").onclick = () => {
  state.fontSize = Math.min(220,state.fontSize + 10);
  applyFontSize();
};

$("toggleToc").onclick = () => {
  setSidebar("toc",state.sidebarTab !== "toc" || !state.tocVisible);
};
$("showSearch").onclick = () => {
  setSidebar("search",true);
  $("searchInput").focus();
};
$("tocTab").onclick = () => setSidebar("toc",true);
$("searchTab").onclick = () => {
  setSidebar("search",true);
  $("searchInput").focus();
};

document.querySelectorAll("[data-lang]").forEach(button => {
  button.onclick = () => {
    state.lang = button.dataset.lang;
    saveState();
    applyLang();
  };
});

$("prevBtn").onclick = () => {
  if (rendition && !busy && !navigating) rendition.prev().catch(console.error);
};
$("nextBtn").onclick = () => {
  if (rendition && !busy && !navigating) rendition.next().catch(console.error);
};

function onReaderKey(event) {
  const tag = event.target?.tagName;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag || "") || event.target?.isContentEditable) return;
  if (busy || navigating || event.ctrlKey || event.metaKey || event.altKey) return;
  if (rendition && event.key === "ArrowLeft") rendition.prev().catch(console.error);
  if (rendition && event.key === "ArrowRight") rendition.next().catch(console.error);
}
document.addEventListener("keyup",onReaderKey);

/* ===================================================================
   INITIAL RESTORATION
=================================================================== */

async function initialize() {
  loadState();
  applyLang();
  $("searchInput").value = state.searchQuery;

  // Applying the saved sidebar must not discard stored book history.
  setSidebar(state.sidebarTab,state.tocVisible);

  setBusy(true,"restoring");
  let saved = null;

  try {
    saved = await readSavedSession();
  } catch (error) {
    console.warn(error);
    if (state.fileName) toast(t("errorRestore"),7000);
  } finally {
    setBusy(false);
  }

  if (
    saved?.id &&
    typeof saved.name === "string" &&
    saved.blob instanceof Blob
  ) {
    await handleFile(saved.blob,saved);
  } else {
    renderSearchResults();
  }
}

initialize().catch(error => {
  console.error(error);
  setBusy(false);
  toast(t("errorRestore") + ": " + error.message,10000);
});
</script>
</body>
</html>
