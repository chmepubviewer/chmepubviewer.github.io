<style>
:root {
  --bg:#1a1a2e;
  --surface:#16213e;
  --surface2:#0f3460;
  --accent:#e94560;
  --cyan:#53a8b6;
  --text:#e0e0e0;
  --muted:#a6aabd;
  --border:rgba(255,255,255,.13);
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body {
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:linear-gradient(135deg,var(--bg),#0d0d1a);
  color:var(--text);
  font-family:"Segoe UI",system-ui,sans-serif;
}
button,input { font:inherit; }
button { cursor:pointer; }
button:disabled { cursor:default; opacity:.4; }
button:focus-visible,input:focus-visible {
  outline:2px solid var(--cyan);
  outline-offset:3px;
}
header {
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  padding:12px 18px;
  background:var(--surface);
  border-bottom:2px solid var(--surface2);
  z-index:10;
}
.logo { display:flex; align-items:center; gap:10px; font-weight:700; }
.logo-icon {
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--cyan));
}
.toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:9px 12px;
  color:var(--text);
  background:var(--surface2);
  border:0;
  border-radius:8px;
  text-decoration:none;
}
.btn:hover:not(:disabled) { background:var(--accent); }
.btn.primary { background:var(--accent); }
.file-button { cursor:pointer; }
.file-button.disabled { pointer-events:none; opacity:.4; }
input[type=file] { display:none; }
.lang-switch { display:flex; border-radius:8px; overflow:hidden; }
.lang-switch button {
  padding:9px 10px;
  border:0;
  background:var(--surface2);
  color:var(--muted);
}
.lang-switch button.active { background:var(--accent); color:white; }
.main { flex:1; min-height:0; display:flex; position:relative; }
.sidebar {
  flex-shrink:0;
  width:310px;
  display:flex;
  flex-direction:column;
  min-height:0;
  background:rgba(15,52,96,.45);
  border-right:1px solid var(--border);
}
.sidebar.hidden { display:none; }
.tabs { display:flex; padding:10px; gap:6px; border-bottom:1px solid var(--border); }
.tab { flex:1; }
.tab.active { background:var(--accent); }
.panel { display:none; min-height:0; flex:1; flex-direction:column; }
.panel.active { display:flex; }
.panel-heading {
  padding:14px 16px;
  margin:0;
  font-size:.8rem;
  color:var(--cyan);
  text-transform:uppercase;
  letter-spacing:.08em;
}
#tocList,#searchResults { overflow:auto; min-height:0; flex:1; }
.toc-item {
  display:block;
  width:100%;
  border:0;
  border-left:3px solid transparent;
  text-align:left;
  background:transparent;
  color:var(--text);
  padding:10px 14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.toc-item:hover { background:rgba(233,69,96,.13); }
.toc-item.active { border-left-color:var(--accent); background:rgba(233,69,96,.24); }
.toc-item.sub { font-size:.85rem; color:var(--muted); }
.search-form { padding:12px; display:flex; gap:6px; }
.search-form input {
  width:0;
  min-width:0;
  flex:1;
  padding:9px;
  border:1px solid var(--border);
  border-radius:7px;
  color:var(--text);
  background:var(--bg);
}
.search-tools { display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 10px; }
.search-tools .btn { font-size:.8rem; padding:6px 8px; }
.search-status { padding:0 12px 12px; font-size:.85rem; color:var(--muted); }
.search-result {
  display:block;
  width:100%;
  padding:12px;
  border:0;
  border-bottom:1px solid var(--border);
  background:transparent;
  color:var(--text);
  text-align:left;
}
.search-result:hover,.search-result.active { background:rgba(233,69,96,.17); }
.result-title { font-weight:600; overflow-wrap:anywhere; }
.result-snippet { margin-top:6px; color:var(--muted); font-size:.82rem; line-height:1.5; }
.result-count { margin-top:5px; color:var(--cyan); font-size:.75rem; }
mark { background:#ffe66d; color:#151515; padding:0; }
.recent-heading { padding:12px; font-size:.8rem; color:var(--muted); }
.recent-query {
  display:block;
  width:100%;
  text-align:left;
  padding:9px 12px;
  border:0;
  background:transparent;
  color:var(--text);
  overflow-wrap:anywhere;
}
.recent-query:hover { background:var(--surface2); }
.reader-wrap { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; position:relative; }
.drop-zone {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:18px;
  padding:30px;
  text-align:center;
}
.drop-zone.dragover { background:rgba(233,69,96,.12); }
.drop-zone h2,.drop-zone p { margin:0; }
.drop-zone p { color:var(--muted); max-width:450px; line-height:1.6; }
.drop-icon { font-size:4rem; }
#viewer,#chm-content {
  display:none;
  flex:1;
  min-height:0;
  margin:14px;
  border-radius:10px;
  background:white;
  overflow:hidden;
  box-shadow:0 10px 35px #0005;
}
#viewer.active,#chm-content.active { display:block; }
#chm-frame { width:100%; height:100%; display:block; border:0; background:white; }
.reader-controls {
  display:none;
  align-items:center;
  justify-content:center;
  gap:15px;
  padding:9px;

}
.progress { min-width:120px; text-align:center; color:var(--muted); font-size:.85rem; }
.loader {
  display:none;
  position:absolute;
  inset:0;
  background:#0d0d1acc;
  backdrop-filter:blur(3px);
  z-index:20;
  align-items:center;
  justify-content:center;
  flex-direction:column;

<script>
"use strict";

/* ===================================================================
   SETTINGS / TRANSLATIONS
=================================================================== */

const $ = id => document.getElementById(id);
const STORE_KEY = "chmEpubViewerState";
const HISTORY_LIMIT = 200;
const SEARCH_HISTORY_LIMIT = 30;
const SEARCH_RESULT_LIMIT = 500;

const I18N = {
  uk: {
    back:"Назад", forward:"Вперед", contents:"Зміст", search:"Пошук",
    open:"Відкрити", tableOfContents:"Зміст книги",
